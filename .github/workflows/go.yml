name: Scheduled Trigger Go CI

on:
  schedule:
    # 09:00 UTC (12:00 TRT). The old 00:00 UTC slot fired while the KVKK site was
    # regularly unreachable from GitHub's Azure runners (04:0x UTC job starts), which
    # is what produced the intermittent red builds.
    - cron: '0 9 * * *'

  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.21
        check-latest: false
        cache: false

    - name: Install dependencies and build
      run: go mod download -x

    - name: Build
      run: go build -o crawler crawler.go

    - name: Run
      run: go run .

    - name: Deploy
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        commit_message: "upd: Kvkk data updated"
        file_pattern: "data.json data.csv"